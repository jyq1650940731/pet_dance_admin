<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>POI搜索</title>
    <style>
        html,
        body,
        #container {
            width: 100%;
            height: 100%;
            margin: 0px;
            font-size: 13px;
        }

        #pickerBox {
            position: absolute;
            z-index: 9999;
            top: 50px;
            right: 30px;
            width: 300px;
        }

        #pickerInput {
            width: 200px;
            padding: 5px 5px;
        }

        #poiInfo {
            background: #fff;
        }

        .amap_lib_placeSearch .poibox.highlight {
            background-color: #CAE1FF;
        }

        .amap_lib_placeSearch .poi-more {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="container" class="map" tabindex="0"></div>
    <div id="pickerBox">
        <input id="pickerInput" placeholder="输入关键字选取地点" />
        <div id="poiInfo"></div>
    </div>

    <script type="text/javascript" src='//webapi.amap.com/maps?v=1.3&key=6b38f70b86e24abdb4bb45f163f981bc'></script>
    <script src="//webapi.amap.com/ui/1.0/main.js?v=1.0.11"></script>

    <script type="text/javascript">
        // 1. 解析URL参数（兼容原有经纬度参数 + 新增componentId）
        const urlParams = new URLSearchParams(window.location.search);
        const componentId = urlParams.get('componentId'); // 获取组件唯一标识
        let longitude = urlParams.get('lng') || ''; // 兼容原有参数，也可以用旧方式兜底
        let latitude = urlParams.get('lat') || '';

        // 兼容你原来的参数解析方式（防止旧逻辑失效）
        if (!longitude || !latitude) {
            const searchArr = location.search.slice(1).split(',');
            longitude = searchArr[0] || '';
            latitude = searchArr[1] || '';
        }

        console.log('组件标识:', componentId, '经纬度:', longitude, latitude);

        const container = {
            resizeEnable: true,
            zoom: 18,
        }

        if (longitude && latitude) {
            container.center = [longitude, latitude];

            setTimeout(() => {
                marker = new AMap.Marker({
                    icon: "//a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-default.png",
                    position: [longitude, latitude],
                    offset: new AMap.Pixel(-13, -30)
                });
                marker.setMap(map);
            }, 500)
        }

        var map = new AMap.Map('container', container);

        AMapUI.loadUI(['misc/PoiPicker'], function (PoiPicker) {
            var poiPicker = new PoiPicker({
                input: 'pickerInput'
            });
            //初始化poiPicker
            poiPickerReady(poiPicker);
        });

        function poiPickerReady(poiPicker) {
            window.poiPicker = poiPicker;
            var marker = new AMap.Marker();
            var infoWindow = new AMap.InfoWindow({
                offset: new AMap.Pixel(0, -20)
            });

            //选取了某个POI
            poiPicker.on('poiPicked', function (poiResult) {
                // 2. 触发事件时携带componentId
                parent.document.dispatchEvent(new CustomEvent('amap', {
                    detail: {
                        componentId: componentId, // 关键：添加组件唯一标识
                        id: poiResult.item.id,
                        lng: poiResult.item.location.lng,
                        lat: poiResult.item.location.lat,
                        address: poiResult.item.address,
                    }
                }));

                var source = poiResult.source,
                    poi = poiResult.item,
                    info = {
                        source: source,
                        id: poi.id,
                        name: poi.name,
                        location: poi.location.toString(),
                        address: poi.address
                    };

                marker.setMap(map);
                infoWindow.setMap(map);

                marker.setPosition(poi.location);
                infoWindow.setPosition(poi.location);

                infoWindow.setContent('POI信息: <pre>' + JSON.stringify(info, null, 2) + '</pre>');
                infoWindow.open(map, marker.getPosition());
            });

            // poiPicker.onCityReady(function() {
            //     poiPicker.suggest('美食');
            // });
        }
    </script>
</body>

</html>
